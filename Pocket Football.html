<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pocket Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one full-viewport canvas; the 1000x600 pitch is letterboxed to any screen and all controls are drawn on the canvas. Single dark look by choice (floodlit night match). */
:root {
  --ink: #0b1d12;
  --pitch: #1c7a3a;
  --pitch-alt: #218a42;
  --chalk: #f2efe4;
  --home: #2f6bff;
  --away: #e8452f;
  --keeper-home: #f5c518;
  --keeper-away: #9b5de5;
  --glow: #ffd23f;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--chalk);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
</style>

<canvas id="c" tabindex="0" aria-label="Football game"></canvas>

<script>
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 1000, H = 600, FL = 40, FR = W - 40, FT = 40, FB = H - 40, GH = 80;
  var css = getComputedStyle(document.documentElement);
  function tok(n) { return css.getPropertyValue(n).trim(); }
  var COL = {
    ink: tok('--ink'), pitch: tok('--pitch'), alt: tok('--pitch-alt'), chalk: tok('--chalk'),
    home: tok('--home'), away: tok('--away'), kh: tok('--keeper-home'), ka: tok('--keeper-away'),
    glow: tok('--glow'), display: tok('--display'), mono: tok('--mono')
  };

  /* ---------- screen scaling ---------- */
  var sc = 1, ox = 0, oy = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    sc = Math.min(r.width / W, r.height / H);
    ox = (r.width - W * sc) / 2;
    oy = (r.height - H * sc) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- helpers ---------- */
  function len(v) { return Math.sqrt(v.x * v.x + v.y * v.y); }
  function norm(v) { var l = len(v); return l > 0.001 ? { x: v.x / l, y: v.y / l } : { x: 0, y: 0 }; }
  function dist(a, b) { return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)); }
  function cl(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  /* ---------- audio (starts on first tap or key) ---------- */
  var ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') { ac.resume(); }
  }
  function tone(f0, f1, secs, vol, type) {
    if (!ac) return;
    var t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.linearRampToValueAtTime(f1, t + secs);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + secs);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + secs + 0.02);
  }
  function sKick() { tone(260, 110, 0.12, 0.3, 'triangle'); }
  function sGoal() { tone(500, 1100, 0.8, 0.22, 'sine'); }
  function sWhistle() { tone(1800, 1800, 0.45, 0.12, 'square'); }

  /* ---------- game data ---------- */
  var AI_SPEED = [2.3, 2.9, 3.4], AI_JITTER = [90, 50, 20], AI_POWER = [8.0, 10.5, 12.5], GK_SPEED = [2.0, 2.8, 3.8];
  var NAMES = ['EASY', 'NORMAL', 'HARD'];
  var SUBS = ['Slow rivals, wide shots', 'A fair match', 'Fast, accurate, sharp keeper'];
  var STICK_HOME = { x: 130, y: H - 120 }, KICKC = { x: W - 120, y: H - 120 };

  var ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 8 };
  var tm = [[], []]; /* tm[team][0,1 = outfield, 2 = keeper] */
  var st = 'menu', diff = 1, score = [0, 0], ctrl = 0, timeLeft = 120, pause = 0, overT = 0, kickPrev = false;
  var facing = { x: 1, y: 0 }, stickUI = null, stickVec = { x: 0, y: 0 }, tNow = 0;

  function mk(x, y, r) { return { x: x, y: y, vx: 0, vy: 0, r: r, cd: 0 }; }
  function resetPlay() {
    ball.x = W / 2; ball.y = H / 2; ball.vx = 0; ball.vy = 0;
    var bx = [W * 0.40, W * 0.25, FL + 30], by = [H * 0.5, H * 0.7, H * 0.5];
    for (var i = 0; i < 3; i++) {
      var r = i === 2 ? 18 : 16;
      tm[0][i] = mk(bx[i], by[i], r);
      tm[1][i] = mk(W - bx[i], H - by[i], r);
    }
  }
  function startMatch(d) {
    diff = d; score = [0, 0]; timeLeft = 120; pause = 0; ctrl = 0; facing = { x: 1, y: 0 };
    resetPlay(); sWhistle(); st = 'play';
  }
  resetPlay();

  function kick(b, dir, power) {
    ball.vx = dir.x * power; ball.vy = dir.y * power;
    b.cd = 0.35; sKick();
  }
  function touchBall(b) {
    if (b.cd > 0) return;
    var dx = ball.x - b.x, dy = ball.y - b.y, dd = Math.sqrt(dx * dx + dy * dy), min = b.r + ball.r;
    if (dd < min && dd > 0.001) {
      var nx = dx / dd, ny = dy / dd;
      ball.x = b.x + nx * min; ball.y = b.y + ny * min;
      ball.vx = nx * 5 + b.vx * 0.9; ball.vy = ny * 5 + b.vy * 0.9;
    }
  }

  /* ---------- input ---------- */
  var keys = {};
  var ptrs = {};
  var MENU_BTNS = [0, 1, 2].map(function (i) { return { x: W / 2 - 150, y: 215 + i * 84, w: 300, h: 70, i: i }; });

  window.addEventListener('keydown', function (e) {
    audio();
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
    if (st === 'menu') {
      if (e.code === 'Digit1') startMatch(0);
      if (e.code === 'Digit2') startMatch(1);
      if (e.code === 'Digit3') startMatch(2);
    } else if (st === 'over' && overT > 1 && (e.code === 'KeyR' || e.code === 'Enter' || e.code === 'Space')) {
      st = 'menu';
    }
  });
  window.addEventListener('keyup', function (e) { delete keys[e.code]; });

  function world(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - ox) / sc, y: (e.clientY - r.top - oy) / sc };
  }
  cv.addEventListener('pointerdown', function (e) {
    audio();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    var p = world(e);
    if (st === 'menu') {
      MENU_BTNS.forEach(function (b) {
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) startMatch(b.i);
      });
    } else if (st === 'over') {
      if (overT > 1) st = 'menu';
    } else {
      var role = dist(p, KICKC) < 100 ? 'kick' : (p.x < W * 0.55 ? 'stick' : null);
      if (role) ptrs[e.pointerId] = { role: role, o: p, p: p };
    }
  });
  cv.addEventListener('pointermove', function (e) {
    var q = ptrs[e.pointerId];
    if (q) q.p = world(e);
  });
  function up(e) { delete ptrs[e.pointerId]; }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- simulation ---------- */
  function update(dt) {
    tNow += dt;
    if (st === 'over') { overT += dt; return; }
    if (st !== 'play') return;
    var k = dt * 60;

    var inp = { x: 0, y: 0 }, kd = !!keys.Space;
    if (keys.KeyD || keys.ArrowRight) inp.x += 1;
    if (keys.KeyA || keys.ArrowLeft) inp.x -= 1;
    if (keys.KeyS || keys.ArrowDown) inp.y += 1;
    if (keys.KeyW || keys.ArrowUp) inp.y -= 1;
    inp = norm(inp);
    stickUI = null; stickVec = { x: 0, y: 0 };
    for (var id in ptrs) {
      var q = ptrs[id];
      if (q.role === 'kick') { kd = true; }
      else {
        var d = { x: q.p.x - q.o.x, y: q.p.y - q.o.y };
        var l = len(d);
        stickUI = q;
        if (l > 12) { inp = norm(d); stickVec = { x: inp.x * Math.min(1, l / 55), y: inp.y * Math.min(1, l / 55) }; }
      }
    }
    var kp = kd && !kickPrev;
    kickPrev = kd;

    if (pause > 0) {
      pause -= dt;
      if (pause <= 0) resetPlay();
      return;
    }
    timeLeft -= dt;

    /* control switches to the blue player nearer the ball */
    var d0 = dist(tm[0][0], ball), d1 = dist(tm[0][1], ball);
    if (ctrl === 0 && d1 + 25 < d0) ctrl = 1;
    else if (ctrl === 1 && d0 + 25 < d1) ctrl = 0;

    var me = tm[0][ctrl];
    if (inp.x || inp.y) facing = { x: inp.x, y: inp.y };
    me.vx = inp.x * 3.6; me.vy = inp.y * 3.6;
    me.x += me.vx * k; me.y += me.vy * k;
    if (kp && me.cd <= 0 && dist(me, ball) < 36) kick(me, facing, 13);

    for (var t = 0; t < 2; t++) {
      var dir = t === 0 ? 1 : -1;
      for (var i = 0; i < 2; i++) {
        if (t === 0 && i === ctrl) continue;
        var b = tm[t][i], o = tm[t][1 - i];
        var chaser = dist(b, ball) <= dist(o, ball);
        var tg = chaser ? { x: ball.x, y: ball.y } : {
          x: cl(ball.x - dir * 130, FL + 60, FR - 60),
          y: cl(H / 2 + (ball.y - H / 2) * 0.6 + (i === 0 ? -70 : 70), FT + 30, FB - 30)
        };
        var dd = norm({ x: tg.x - b.x, y: tg.y - b.y });
        var sp = t === 0 ? 2.9 : AI_SPEED[diff];
        b.vx = 0; b.vy = 0;
        if (dist(tg, b) > 6) {
          b.vx = dd.x * sp; b.vy = dd.y * sp;
          b.x += b.vx * k; b.y += b.vy * k;
        }
        if (chaser && b.cd <= 0 && dist(b, ball) < 36) {
          var J = t === 1 ? AI_JITTER[diff] : 50;
          var P = t === 1 ? AI_POWER[diff] : 10.5;
          var a = norm({ x: (t === 0 ? FR : FL) - ball.x, y: H / 2 - ball.y + rand(-J, J) });
          kick(b, a, P);
        }
      }
      /* goalkeeper */
      var g = tm[t][2];
      var ty = cl(ball.y, H / 2 - GH + 10, H / 2 + GH - 10);
      var gsp = t === 1 ? GK_SPEED[diff] : 3.0;
      var gdy = ty - g.y;
      g.vx = 0; g.vy = 0;
      if (Math.abs(gdy) > 2) { g.vy = gdy > 0 ? gsp : -gsp; g.y += g.vy * k; }
      g.x = t === 0 ? FL + 30 : FR - 30;
      if (g.cd <= 0 && dist(g, ball) < 36) {
        kick(g, norm({ x: dir, y: rand(-0.4, 0.4) }), 11);
      }
    }

    for (var tt = 0; tt < 2; tt++) {
      for (var ii = 0; ii < 3; ii++) {
        var p = tm[tt][ii];
        p.cd -= dt;
        p.x = cl(p.x, FL, FR); p.y = cl(p.y, FT, FB);
        touchBall(p);
      }
    }

    /* ball physics */
    ball.x += ball.vx * k; ball.y += ball.vy * k;
    var fr = Math.pow(0.985, k);
    ball.vx *= fr; ball.vy *= fr;
    var mouth = Math.abs(ball.y - H / 2) < GH;
    if (ball.y < FT + ball.r) { ball.y = FT + ball.r; ball.vy *= -0.8; }
    if (ball.y > FB - ball.r) { ball.y = FB - ball.r; ball.vy *= -0.8; }
    if (!mouth) {
      if (ball.x < FL + ball.r) { ball.x = FL + ball.r; ball.vx *= -0.8; }
      if (ball.x > FR - ball.r) { ball.x = FR - ball.r; ball.vx *= -0.8; }
    }
    if (ball.x < FL - 12) { score[1]++; pause = 1.5; sGoal(); }
    else if (ball.x > FR + 12) { score[0]++; pause = 1.5; sGoal(); }

    if (timeLeft <= 0) { timeLeft = 0; st = 'over'; overT = 0; ptrs = {}; sWhistle(); }
  }

  /* ---------- drawing ---------- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(s, x, y, size, color, align, weight, mono) {
    ctx.font = (mono ? '500 ' : (weight || 800) + ' ') + size + 'px ' + (mono ? COL.mono : COL.display);
    ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(s, x, y);
  }

  function drawPitch() {
    ctx.fillStyle = COL.pitch; ctx.fillRect(0, 0, W, H);
    var sw = (FR - FL) / 10;
    ctx.fillStyle = COL.alt;
    for (var i = 0; i < 10; i += 2) ctx.fillRect(FL + i * sw, FT, sw, FB - FT);
    ctx.strokeStyle = COL.chalk; ctx.lineWidth = 2; ctx.globalAlpha = 0.9;
    ctx.strokeRect(FL, FT, FR - FL, FB - FT);
    ctx.beginPath(); ctx.moveTo(W / 2, FT); ctx.lineTo(W / 2, FB); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 70, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeRect(FL, H / 2 - 130, 130, 260);
    ctx.strokeRect(FR - 130, H / 2 - 130, 130, 260);
    ctx.strokeRect(FL, H / 2 - GH, 50, GH * 2);
    ctx.strokeRect(FR - 50, H / 2 - GH, 50, GH * 2);
    ctx.globalAlpha = 1;
    ctx.fillStyle = COL.chalk;
    [[W / 2, H / 2], [FL + 95, H / 2], [FR - 95, H / 2]].forEach(function (s) {
      ctx.beginPath(); ctx.arc(s[0], s[1], 3, 0, Math.PI * 2); ctx.fill();
    });
    /* goals with netting */
    [[FL - 12, 0], [FR, 1]].forEach(function (g) {
      ctx.fillStyle = 'rgba(242,239,228,0.18)';
      ctx.fillRect(g[0], H / 2 - GH, 12, GH * 2);
      ctx.strokeStyle = 'rgba(242,239,228,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (var y = H / 2 - GH; y <= H / 2 + GH; y += 16) { ctx.moveTo(g[0], y); ctx.lineTo(g[0] + 12, y); }
      ctx.moveTo(g[0] + 6, H / 2 - GH); ctx.lineTo(g[0] + 6, H / 2 + GH);
      ctx.stroke();
      ctx.strokeStyle = COL.chalk; ctx.lineWidth = 3;
      ctx.strokeRect(g[0], H / 2 - GH, 12, GH * 2);
    });
  }

  function drawPlayer(p, color, num, keeper) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(p.x + 2, p.y + p.r * 0.7, p.r, p.r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(11,29,18,0.75)'; ctx.stroke();
    text(keeper ? 'GK' : String(num), p.x, p.y + 5, keeper ? 14 : 17, keeper ? COL.ink : COL.chalk, 'center', 800);
  }

  function drawPlayers() {
    for (var t = 0; t < 2; t++) {
      for (var i = 0; i < 3; i++) {
        var keeper = i === 2;
        var c = keeper ? (t === 0 ? COL.kh : COL.ka) : (t === 0 ? COL.home : COL.away);
        drawPlayer(tm[t][i], c, i === 0 ? 9 : 7, keeper);
      }
    }
    var cp = tm[0][ctrl];
    ctx.strokeStyle = COL.glow; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cp.x, cp.y, cp.r + 5 + Math.sin(tNow * 8) * 1.5, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(ball.x + 2, ball.y + 4, ball.r, ball.r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.chalk;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = COL.ink; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = COL.ink;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, 2.6, 0, Math.PI * 2); ctx.fill();
  }

  function drawHUD() {
    /* scoreboard */
    ctx.fillStyle = 'rgba(11,29,18,0.82)'; rr(W / 2 - 150, 4, 300, 34, 10); ctx.fill();
    text('YOU', W / 2 - 128, 31, 24, COL.home, 'left', 800);
    text('CPU', W / 2 + 128, 31, 24, COL.away, 'right', 800);
    text(score[0] + ' - ' + score[1], W / 2, 32, 28, COL.chalk, 'center', 800);
    var tl = Math.max(0, timeLeft), m = Math.floor(tl / 60), s = Math.floor(tl % 60);
    text((m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s, W - 24, 30, 22, COL.glow, 'right', 500, true);
    text(NAMES[diff], 24, 30, 22, COL.chalk, 'left', 500, true);

    /* touch controls */
    var o = stickUI ? stickUI.o : STICK_HOME;
    ctx.fillStyle = 'rgba(242,239,228,0.10)';
    ctx.beginPath(); ctx.arc(o.x, o.y, 80, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(242,239,228,0.35)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(242,239,228,0.45)';
    ctx.beginPath(); ctx.arc(o.x + stickVec.x * 50, o.y + stickVec.y * 50, 34, 0, Math.PI * 2); ctx.fill();
    var kicking = false;
    for (var id in ptrs) if (ptrs[id].role === 'kick') kicking = true;
    ctx.fillStyle = kicking ? 'rgba(232,69,47,0.85)' : 'rgba(232,69,47,0.5)';
    ctx.beginPath(); ctx.arc(KICKC.x, KICKC.y, 68, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(242,239,228,0.6)'; ctx.lineWidth = 2; ctx.stroke();
    text('KICK', KICKC.x, KICKC.y + 9, 28, COL.chalk, 'center', 800);

    if (pause > 0) {
      text('GOAL!', W / 2, H / 2 + 22, 96, COL.glow, 'center', 800);
    }
  }

  function drawMenu() {
    ctx.fillStyle = 'rgba(11,29,18,0.72)'; ctx.fillRect(0, 0, W, H);
    text('POCKET FOOTBALL', W / 2, 110, 76, COL.chalk, 'center', 800);
    text('Two outfielders and a keeper a side. Two minutes on the clock.', W / 2, 148, 22, COL.glow, 'center', 600);
    MENU_BTNS.forEach(function (b) {
      ctx.fillStyle = 'rgba(11,29,18,0.9)'; rr(b.x, b.y, b.w, b.h, 12); ctx.fill();
      ctx.strokeStyle = COL.chalk; ctx.lineWidth = 2.5; ctx.stroke();
      text(NAMES[b.i], b.x + 24, b.y + 33, 32, COL.chalk, 'left', 800);
      text(SUBS[b.i], b.x + 24, b.y + 55, 17, 'rgba(242,239,228,0.7)', 'left', 600);
      text(String(b.i + 1), b.x + b.w - 24, b.y + 43, 22, COL.glow, 'right', 500, true);
    });
    text('Touch: left thumb moves, KICK shoots   |   Keys: WASD or arrows, Space', W / 2, 520, 18, 'rgba(242,239,228,0.75)', 'center', 500, true);
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(11,29,18,0.78)'; ctx.fillRect(0, H / 2 - 110, W, 220);
    var msg = score[0] > score[1] ? 'YOU WIN' : (score[0] < score[1] ? 'YOU LOSE' : 'DRAW');
    text('FULL TIME  ' + score[0] + ' - ' + score[1], W / 2, H / 2 - 50, 34, COL.chalk, 'center', 600);
    text(msg, W / 2, H / 2 + 30, 92, COL.glow, 'center', 800);
    if (overT > 1) text('Tap or press Enter for the menu', W / 2, H / 2 + 80, 20, 'rgba(242,239,228,0.8)', 'center', 500, true);
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = COL.ink; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    drawPitch();
    if (st !== 'menu') { drawPlayers(); drawHUD(); }
    if (st === 'menu') drawMenu();
    if (st === 'over') drawOver();
    ctx.restore();
  }

  /* ---------- main loop ---------- */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('800 24px "Barlow Condensed"'), document.fonts.load('500 20px "DM Mono"')]).catch(function () {});
  }
  requestAnimationFrame(frame);
})();
</script>
